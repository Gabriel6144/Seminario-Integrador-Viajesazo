spring.application.name=turismo-backend

# H2 en memoria: el esquema se recrea en cada arranque
spring.datasource.url=jdbc:h2:mem:turismo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera el esquema desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Las colecciones (@ElementCollection) son LAZY. Al listar propuestas se evita el
# N+1 cargando las imagenes y franjas en lotes de 20.
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# SQL de Hibernate. Default WARN para no volcar queries (y params) en logs.
# En local: HIBERNATE_SQL_LOG=DEBUG si hace falta depurar.
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:WARN}

# Datos de arranque para la demo. Con ddl-auto=create-drop el esquema se borra en cada
# arranque, así que sin esto la aplicación levanta vacía.
#
# defer-datasource-initialization es imprescindible: sin él, spring.sql.init corre ANTES de que
# Hibernate cree las tablas y el script muere con "Table PUBLICADOR not found". Esta propiedad
# invierte el orden para que el seed corra contra un esquema que ya existe.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Sin esto, Spring lee data.sql con el charset por defecto de la plataforma. En Windows eso es
# Windows-1252, y los acentos del seed entran en la base como "CosquA-n" / "Turismo CA3rdoba".
# El bug solo se ve en desarrollo: en Linux el default ya es UTF-8 y pasa desapercibido.
spring.sql.init.encoding=UTF-8

# Paginación de los listados. max-page-size evita que un ?size=100000 tumbe la app.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Geocodificación con OpenStreetMap (Nominatim). No requiere API key, pero sí un User-Agent
# identificable por su política de uso: https://operations.osmfoundation.org/policies/nominatim/
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=Viajesazo/1.0 (tesis academica; contacto info@viajesazo.com)

# Imágenes subidas por el publicador. `dir` es la carpeta en disco (no versionada, ver .gitignore)
# y `url-base` es el prefijo público que sirve WebConfig. Cuelga de /api a propósito: reusa el
# proxy de Vite y así el navegador las ve same-origin, sin CORS.
#
# OJO: el prefijo de servido NO puede solaparse con el de ImagenController (`/api/imagenes`). Con
# el prefijo viejo (/api/imagenes), un GET /api/imagenes/{archivo} hacía match con el
# @DeleteMapping("/{nombre}") y Spring respondía 405 (método no soportado) ANTES de llegar al
# resource handler: la imagen subida no se veía nunca. Por eso los archivos se sirven en
# /api/archivos, un prefijo propio que ningún controller mapea.
app.imagenes.dir=./data/imagenes
app.imagenes.url-base=/api/archivos

# Límite del contenedor para las subidas. El ImagenService vuelve a chequear el tamaño (red de
# seguridad) pero este tope corta el request antes de bufferizarlo entero.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Transiciones automaticas por fecha (PLANIFICADO -> EN_CURSO -> FINALIZADO).
# El scheduler corre cada minuto; en los tests se desactiva desde Surefire.
app.viajes.transiciones.enabled=true
app.viajes.transiciones.fixed-delay-ms=60000
app.viajes.transiciones.initial-delay-ms=0

# JWT / sesión. El secret de desarrollo debe tener al menos 256 bits para HS256.
# En producción: APP_JWT_SECRET (fuerte) y APP_JWT_COOKIE_SECURE=true detrás de HTTPS.
app.jwt.secret=${APP_JWT_SECRET:change-me-viajesazo-dev-secret-key-must-be-long-enough-256bits!!}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=14
app.jwt.cookie-secure=${APP_JWT_COOKIE_SECURE:false}
app.jwt.issuer=${APP_JWT_ISSUER:viajesazo}
app.jwt.audience=${APP_JWT_AUDIENCE:viajesazo-api}
