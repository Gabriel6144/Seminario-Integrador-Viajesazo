spring.application.name=turismo-backend

# H2 en memoria: el esquema se recrea en cada arranque
spring.datasource.url=jdbc:h2:mem:turismo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera el esquema desde las entidades
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Para ver las sentencias SQL en desarrollo, subir a DEBUG solo el logger de Hibernate
# en vez de show-sql: no escribe a stdout y se puede apagar por paquete.
logging.level.org.hibernate.SQL=DEBUG

# Datos de arranque para la demo. Con ddl-auto=create-drop el esquema se borra en cada
# arranque, así que sin esto la aplicación levanta vacía.
#
# defer-datasource-initialization es imprescindible: sin él, spring.sql.init corre ANTES de que
# Hibernate cree las tablas y el script muere con "Table PUBLICADOR not found". Esta propiedad
# invierte el orden para que el seed corra contra un esquema que ya existe.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Sin esto, Spring lee data.sql con el charset por defecto de la plataforma. En Windows eso es
# Windows-1252, y los acentos del seed entran en la base como "CosquA-n" / "Turismo CA3rdoba".
# El bug solo se ve en desarrollo: en Linux el default ya es UTF-8 y pasa desapercibido.
spring.sql.init.encoding=UTF-8

# Paginación de los listados. max-page-size evita que un ?size=100000 tumbe la app.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

